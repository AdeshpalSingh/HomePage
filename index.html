    <h1>Login, Register & Homepage Flow Using LocalStorage</h1>

    <script>
        //Login, Register & Homepage Flow Using LocalStorage
        // Q1. Register Page
        // Create a registration form containing:
        // Full Name, Email, Password, Confirm Password, Register Button

        function register(event) {
            event.preventDefault();
            let name = document.getElementById("name").value
            let email = document.getElementById("email").value
            let password = document.getElementById("password").value
            let confirmPassword = document.getElementById("confirmPassword").value

            if (password !== confirmPassword) {
                document.getElementById("message").innerText = "Passwords do not match";
                return;
            }

            localStorage.setItem("userName", name);
            localStorage.setItem("userEmail", email);
            localStorage.setItem("userPassword", password);

            document.getElementById("message").innerText = "Registration successful!";
            window.location.href = "LoginPage.html";
        }



        // Q2. Login Page
        // Create a login form containing:
        // Email, Password, Login Button, Link to Register Page

        function login(event) {

            event.preventDefault();

            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            let savedEmail = localStorage.getItem("userEmail");
            let savedPassword = localStorage.getItem("userPassword");

            if (email === savedEmail && password === savedPassword) {

                localStorage.setItem("isLoggedIn", "true");

                window.location.href = "home.html";

            } else {

                document.getElementById("message").innerText ="Invalid email or password";
            }
        }
